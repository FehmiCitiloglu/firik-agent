[verification]
commands = [
  { name = "format", command = ["python", "-m", "ruff", "format", "--check", "."] },
  { name = "lint", command = ["python", "-m", "ruff", "check", "."] },
  { name = "types", command = ["python", "-m", "mypy", "firik_agent"] },
  { name = "tests", command = ["python", "-m", "pytest", "-q"], timeout_seconds = 600 },
  { name = "build", command = ["python", "-m", "build"] },
]
