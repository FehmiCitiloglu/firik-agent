name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag (for example v0.2.1)'
        required: true
      signing_check_only:
        description: 'Validate Apple certificate and notarization credentials without publishing a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-apple-signing:
    if: inputs.signing_check_only == true
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate Developer ID and Apple notarization credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/setup_macos_signing.py
      - name: Remove temporary Apple signing credentials
        if: always()
        shell: bash
        run: |
          signing_keychain="$RUNNER_TEMP/firik-signing.keychain-db"
          if [[ -f "$signing_keychain" ]]; then
            security delete-keychain "$signing_keychain"
          fi
          rm -f "$RUNNER_TEMP/firik-signing.p12"

  build-desktop:
    if: inputs.signing_check_only != true
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64, arch: arm64}
          - {os: macos-15-intel, platform: macos-x64, arch: x64}
          - {os: windows-2022, platform: windows-x64, arch: x64}
          - {os: ubuntu-22.04, platform: linux-x86_64, arch: x64}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 libsecret-1-dev xvfb xauth openbox rpm libportaudio2 espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,desktop-build]'
      - name: Install Chromium and Linux runtime dependencies for release validation
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for release validation
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python scripts/validate_release.py
      - name: Test on Linux with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & python -m pytest'
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        run: python scripts/test_desktop.py
      - name: Prepare Apple signing certificate and notarization credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/setup_macos_signing.py
      - name: Build desktop application
        env:
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: '1'
        run: python -m PyInstaller firik-agent.spec --clean --noconfirm
      - name: Smoke test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_desktop.py --browser
      - name: Smoke test packaged application on Windows
        if: runner.os == 'Windows'
        run: python scripts/smoke_desktop.py --browser
      - name: Notarize macOS application and create signed installers
        if: runner.os == 'macOS'
        run: python scripts/sign_macos.py --skip-build --identity "$FIRIK_CODESIGN_IDENTITY" --profile firik-notary
      - name: Create native installers
        if: runner.os != 'macOS'
        run: python scripts/package_desktop.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release_assets/*
          if-no-files-found: error
      - name: Preserve macOS notarization reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.platform }}
          path: build/notarization/*.json
          if-no-files-found: ignore
      - name: Remove temporary Apple signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          signing_keychain="$RUNNER_TEMP/firik-signing.keychain-db"
          if [[ -f "$signing_keychain" ]]; then
            security delete-keychain "$signing_keychain"
          fi
          rm -f "$RUNNER_TEMP/firik-signing.p12"

  build-hybrid-desktop:
    if: inputs.signing_check_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FIRIK_DESKTOP_PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Install Python build and test dependencies
        run: python -m pip install -e '.[dev,desktop-build]'
      - name: Install pinned desktop dependencies
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
      - name: Build desktop, verify contracts and run hybrid unit tests
        shell: bash
        run: |
          npm run desktop:build
          git diff --ignore-cr-at-eol --exit-code -- packages/contracts/wire.schema.json packages/contracts/src/wire.ts
          npm run desktop:check
          python -m pytest -q tests/test_desktop_rpc.py tests/test_package_hybrid_release.py
          npm run desktop:test
      - name: Package hybrid desktop app
        run: npm run desktop:package
      - name: Archive hybrid release asset
        run: python scripts/package_hybrid_release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-desktop-${{ matrix.platform }}
          path: release_assets/*
          if-no-files-found: error

  build-python:
    if: inputs.signing_check_only != true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: inputs.signing_check_only != true
    needs: [build-desktop, build-hybrid-desktop, build-python]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: hybrid-desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release_assets
      - name: Verify all installers and generate SHA256 checksums
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python scripts/validate_release.py --assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: firik-agent ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: packaging/release-notes.md
          files: release_assets/*
