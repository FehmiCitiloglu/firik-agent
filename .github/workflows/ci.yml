name: CI - Sürekli Entegrasyon ve Testler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          - os: ubuntu-22.04
            python-version: '3.11'

    steps:
      - uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }} Kur
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Linux Bağımlılıkları (Tkinter & SecretService)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 libtcl8.6 libsecret-1-dev xvfb xauth openbox libportaudio2 espeak-ng

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Optional voice dependencies (Python 3.11)
        if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[voice]'

      - name: Testler (Linux sanal ekran)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & python -m pytest'

      - name: Testler (macOS ve Windows)
        if: runner.os != 'Linux'
        run: python scripts/test_desktop.py

  hybrid-desktop:
    name: Hybrid desktop contracts, build and tests
    runs-on: ubuntu-latest
    env:
      FIRIK_DESKTOP_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install pinned desktop dependencies
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
      - name: Build desktop and check shared contracts
        run: |
          npm run desktop:build
          git diff --exit-code -- packages/contracts/wire.schema.json packages/contracts/src/wire.ts
          npm run desktop:check
      - name: Test desktop boundary
        run: |
          python -m pytest -q tests/test_desktop_rpc.py tests/test_install.py tests/test_package_hybrid_release.py
          npm run desktop:test

  hybrid-browser:
    name: Hybrid TypeScript browser with matching Chromium
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Install contract generator dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install pinned desktop dependencies
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
      - name: Build worker and install its exact browser revision
        run: |
          npm run desktop:build
          npm run desktop:browser:install
      - name: Verify real Chromium with its sandbox enabled
        run: npm run desktop:test:browser

  build-python:
    name: Build Python wheel and sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  build-hybrid:
    name: Build Hybrid Desktop (${{ matrix.platform }})
    needs: [hybrid-desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FIRIK_DESKTOP_PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Install Python build dependencies
        run: python -m pip install -e '.[desktop-build]'
      - name: Install pinned desktop dependencies
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
      - name: Package hybrid desktop app
        run: npm run desktop:package
      - name: Archive hybrid build artifact
        run: python scripts/package_hybrid_release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-desktop-${{ matrix.platform }}
          path: release_assets/*
          retention-days: 14
          if-no-files-found: error
