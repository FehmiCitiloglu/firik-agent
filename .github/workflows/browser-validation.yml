name: Native Browser validation

# Browser downloads and loopback fixtures run only on explicit maintainer action.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      FIRIK_BROWSER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install optional browser and test dependencies
        run: python -m pip install -e '.[dev,browser]'
      - name: Install matching Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install matching Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Host authorization and privacy regressions
        run: >-
          python -m pytest -q tests/test_browser_runtime.py
          tests/test_browser_security.py tests/test_browser_coding.py
          tests/test_browser_provider.py tests/test_browser_privacy.py
          tests/test_browser_surfaces.py
      - name: Real headless Chromium and supervised development server
        run: >-
          python -m pytest -q tests/test_browser_chromium.py
          tests/test_browser_coding_chromium.py tests/test_dev_servers.py
          -k 'not headed_handoff' --junitxml=browser-results.xml
      - name: Browser doctor
        run: python -m firik_agent.cli browser doctor --launch
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}-python-${{ matrix.python }}
          path: browser-results.xml
          if-no-files-found: ignore
          retention-days: 7
