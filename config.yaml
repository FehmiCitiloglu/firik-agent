agent:
  name: FirikAgent
  system_prompt: 'You are FirikAgent, an autonomous, extensible AI assistant equipped
    with dynamic Model Context Protocol (MCP) servers, modular Skills, and lifecycle
    Plugins. You can inspect your tools, call external servers, add new skills, install
    plugins, and switch model providers seamlessly. Always be helpful, precise, and
    thoughtful.

    '
  default_provider: firik
  max_iterations: null
  temperature: 0.7
  stream: true
providers:
  firik:
    type: firik
    base_url: https://evren-llmapi.ssyz.org.tr/v1
    api_key_env: FIRIK_API_KEY
    default_model: mimo-v2.6-pro
    models:
    - id: glm-5.3
      name: GLM 5.3
      context_window: 512000
      supports_tools: true
    - id: deepseek-v4-flash
      name: DeepSeek V4 Flash
      context_window: 1000000
      supports_tools: true
    - id: qwen3.8-flash-next
      name: Qwen 3.8 Flash Next
      context_window: 256000
      supports_tools: true
    - id: gemma-4-31b
      name: Gemma 4 31B
      context_window: 256000
      supports_tools: true
    - id: qwen3-vl-30b
      name: Qwen 3 VL 30B (Vision)
      context_window: 256000
      supports_tools: true
    - id: auto
      name: Auto Smart Routing
      supports_tools: true
  llmtr:
    type: firik_gateway
    base_url: https://llmtr.com/v1
    api_key_env: LLMTR_API_KEY
    default_model: evren/glm-5.3-fp8
    models:
    - id: evren/glm-5.3-fp8
      name: Firik GLM 5.3 FP8 (via LLMTR)
      context_window: 512000
    - id: evren/deepseek-v4-flash-tr
      name: Firik DeepSeek V4 Flash TR (via LLMTR)
      context_window: 1000000
    - id: evren/gemma-4-31b
      name: Firik Gemma 4 31B (via LLMTR)
      context_window: 256000
    - id: evren/qwen3.8-flash-next
      name: Firik Qwen 3.8 Flash Next (via LLMTR)
      context_window: 256000
    - id: evren/qwen3-vl-30b
      name: Firik Qwen 3 VL 30B (via LLMTR)
      context_window: 256000
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o
mcp_servers:
  computer-use:
    transport: stdio
    command: builtin:computer-use
    enabled: true
    autostart: true
    default_for_chat: true
  parallel-search:
    url: https://search.parallel.ai/mcp
skills:
  directory: skills
  autoload_builtins: true
  active_skills:
  - code_assistant
  - computer-use
plugins:
  directory: plugins
  autoload_builtins: true
  enabled_plugins:
  - logger
  - calculator
disabled_default_mcps: []
