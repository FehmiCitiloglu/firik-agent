[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firik-agent"
version = "0.2.0"
description = "A gated software-development agent with pluggable model providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Firik Agent contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = ["huggingface-hub>=0.34"]

[project.optional-dependencies]
agent = [
    "ddgs>=9.14,<10",
    "smolagents>=1.26,<2",
]
web = ["ddgs>=9.14,<10"]
local = [
    "accelerate>=1.10",
    "ddgs>=9.14,<10",
    "smolagents[transformers]>=1.26,<2",
    "torch>=2.4",
    "transformers>=4.56",
]
dev = [
    "build>=1.3",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[project.scripts]
firik-agent = "firik_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["firik_agent*"]

[tool.setuptools.package-data]
firik_agent = ["web/*", "web/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "smolagents",
    "smolagents.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
