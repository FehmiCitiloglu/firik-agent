[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firik-agent"
version = "0.2.24"

description = "Firik Agent: desktop and CLI AI assistant with MCP, Skills, Plugins and FIRIK API support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "prompt-toolkit>=3.0.0",
    "customtkinter>=6.0.0",
    "tkinterdnd2>=0.6.3,<1",
    "pillow>=10.0.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
firik = "firik_agent.api.cli:main"
firik-agent = "firik_agent.cli:main"
firik-gui = "firik_agent.ui.app:main"

[tool.setuptools.package-data]
"firik_agent.api" = ["openapi.json"]
"firik_agent.ui" = ["assets/*"]
"firik_agent" = ["builtin_skills/*/*.md", "builtin_skills/*/*.yaml"]

[tool.setuptools.packages.find]
include = ["firik_agent*"]
