[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hf-llm-agent"
version = "0.1.0"
description = "LLM Agent System with Dynamic Hugging Face Model Loading/Ejection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "HF-LLM Agent Team", email = "team@hf-llm-agent.dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "huggingface_hub>=0.21.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/hf-llm-agent"
Repository = "https://github.com/hf-llm-agent/hf-llm-agent"
Documentation = "https://hf-llm-agent.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["hf_llm_agent*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
